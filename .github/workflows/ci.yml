name: Continuous Integration

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        pip-sync requirements.txt
    - run: python -m mypy semantic_engine/
    - run: python -m pytest semantic_engine/tests/
