name: Continuous Integration

on:
  push:
    branches: [ "main", "feat/**" ]
    paths:
      - 'semantic_engine/**'
      - 'migrations/**'
      - 'requirements.*'
      - 'pytest.ini'
      - 'alembic.ini'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'semantic_engine/**'
      - 'migrations/**'
      - 'requirements.*'
      - 'pytest.ini'
      - 'alembic.ini'
      - '.github/workflows/ci.yml'

jobs:
  test-and-type-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: semantic_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        pip-sync requirements.txt
    - name: Run Static Type Checker (mypy)
      run: python -m mypy semantic_engine/

    - name: Run Dependency Toplogy Check (import-linter)
      run: lint-imports

    - name: Run Cyclomatic Complexity Check (xenon)
      # Fails if any block is > B (scale A-F) or average is > A
      run: xenon --max-absolute B --max-modules B --max-average A semantic_engine/

    - name: Run Unit Tests & Coverage (pytest-cov)
      env:
        DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_db"
      run: python -m pytest --cov=semantic_engine --cov-fail-under=90 semantic_engine/tests/
