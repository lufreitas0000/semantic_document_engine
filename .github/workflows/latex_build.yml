name: Build LaTeX Monograph

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/latex_build.yml'
  pull_request:
    paths:
      - 'docs/**'

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository DAG
        uses: actions/checkout@v4

      - name: Allocate TeX Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Compile AST to PDF
        working-directory: docs
        run: |
          pdflatex main.tex
          pdflatex main.tex

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semantic_Engine_Monograph
          path: docs/main.pdf
